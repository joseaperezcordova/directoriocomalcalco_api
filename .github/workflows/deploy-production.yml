name: Deploy a Produccion

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs

      - name: Deploy por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR_PROD }}
          exclude: |
            **/.git*
            **/.git*/**
            .vscode/**
            node_modules/**
            storage/logs/**
            .env
            .env.*
            !.env.example

      - name: Fix permisos .htaccess via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -e "
            set ftp:passive-mode yes;
            set ssl:verify-certificate no;
            open -u ${{ secrets.FTP_USERNAME_PROD }},${{ secrets.FTP_PASSWORD_PROD }} ${{ secrets.FTP_SERVER_PROD }};
            cd ${{ secrets.FTP_SERVER_DIR_PROD }};
            chmod 755 .;
            chmod 644 .htaccess;
            chmod 755 public;
            chmod 644 public/.htaccess;
            quit
          "
